---
- name: Validate required parameters
  ansible.builtin.assert:
    that:
      - rhoai_api_url | length > 0
      - rhoai_api_token | length > 0
      - rhoai_webhook_url | length > 0
    fail_msg: "Required parameters rhoai_api_url, rhoai_api_token, and rhoai_webhook_url must be set."

- name: Register webhook endpoint with RHOAI
  stevefulme1.rhoai_mlops.model_endpoint:
    api_url: "{{ rhoai_api_url }}"
    api_token: "{{ rhoai_api_token }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    name: eda-webhook-endpoint
    namespace: "{{ rhoai_webhook_namespace }}"
    state: present
  register: webhook_endpoint

- name: Configure event subscriptions
  ansible.builtin.uri:
    url: "{{ rhoai_api_url }}/apis/v1/webhooks"
    method: POST
    headers:
      Authorization: "Bearer {{ rhoai_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      url: "{{ rhoai_webhook_url }}"
      secret: "{{ rhoai_webhook_secret }}"
      events: "{{ rhoai_webhook_events }}"
      active: true
    validate_certs: "{{ rhoai_validate_certs }}"
    status_code: [200, 201]
  register: webhook_config
  no_log: true

- name: Verify webhook connectivity
  ansible.builtin.uri:
    url: "{{ rhoai_api_url }}/apis/v1/webhooks/test"
    method: POST
    headers:
      Authorization: "Bearer {{ rhoai_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      webhook_url: "{{ rhoai_webhook_url }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    status_code: [200]
  register: webhook_test
  failed_when: webhook_test.json.status != "ok"

- name: Display webhook configuration
  ansible.builtin.debug:
    msg: >-
      Webhook configured successfully.
      URL: {{ rhoai_webhook_url }}
      Events: {{ rhoai_webhook_events | join(', ') }}
