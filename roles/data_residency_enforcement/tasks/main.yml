---
- name: Validate data residency enforcement parameters
  ansible.builtin.assert:
    that:
      - rhoai_api_url | length > 0
      - rhoai_api_token | length > 0
    fail_msg: "Parameters rhoai_api_url and rhoai_api_token are required."

- name: Apply geo-fencing policies for each data classification
  stevefulme1.rhoai_mlops.data_residency_policy:
    api_url: "{{ rhoai_api_url }}"
    api_token: "{{ rhoai_api_token }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    policy_name: "{{ item.policy_name }}"
    allowed_regions: "{{ item.allowed_regions | default(default_allowed_regions) }}"
    denied_regions: "{{ item.denied_regions | default([]) }}"
    data_classification: "{{ item.data_classification | default('confidential') }}"
    enforcement_mode: "{{ item.enforcement_mode | default(default_enforcement_mode) }}"
    applies_to: "{{ item.applies_to | default('all') }}"
    state: present
  loop: "{{ residency_policies }}"
  loop_control:
    label: "{{ item.policy_name }} ({{ item.data_classification | default('confidential') }})"
  when: residency_policies | length > 0

- name: Configure data locality constraints for training workloads
  stevefulme1.rhoai_mlops.data_residency_policy:
    api_url: "{{ rhoai_api_url }}"
    api_token: "{{ rhoai_api_token }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    policy_name: "{{ training_locality_policy_name }}"
    allowed_regions: "{{ training_allowed_regions }}"
    denied_regions: "{{ training_denied_regions }}"
    data_classification: "{{ training_data_classification }}"
    enforcement_mode: "{{ default_enforcement_mode }}"
    applies_to: training
    state: present
  when: enforce_training_locality

- name: Configure data locality constraints for inference workloads
  stevefulme1.rhoai_mlops.data_residency_policy:
    api_url: "{{ rhoai_api_url }}"
    api_token: "{{ rhoai_api_token }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    policy_name: "{{ inference_locality_policy_name }}"
    allowed_regions: "{{ inference_allowed_regions }}"
    denied_regions: "{{ inference_denied_regions }}"
    data_classification: "{{ inference_data_classification }}"
    enforcement_mode: "{{ default_enforcement_mode }}"
    applies_to: inference
    state: present
  when: enforce_inference_locality

- name: Set up cross-border audit logging
  stevefulme1.rhoai_mlops.geo_fence_audit:
    api_url: "{{ rhoai_api_url }}"
    api_token: "{{ rhoai_api_token }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    audit_name: "{{ cross_border_audit_name }}"
    policy_name: "{{ item.policy_name }}"
    scan_scope: all
    report_violations: true
    auto_remediate: "{{ auto_remediate_violations }}"
    state: present
  loop: "{{ residency_policies }}"
  loop_control:
    label: "audit-{{ item.policy_name }}"
  when:
    - cross_border_audit_enabled
    - residency_policies | length > 0

- name: Deploy sovereignty monitoring report
  stevefulme1.rhoai_mlops.data_sovereignty_report:
    api_url: "{{ rhoai_api_url }}"
    api_token: "{{ rhoai_api_token }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    report_name: "{{ sovereignty_report_name }}"
    jurisdiction: "{{ default_jurisdiction }}"
    include_cross_border: true
    include_data_lineage: true
    state: present
  when: deploy_sovereignty_monitoring

- name: Display data residency enforcement summary
  ansible.builtin.debug:
    msg: >-
      Data residency enforcement configured.
      Policies applied: {{ residency_policies | length }}.
      Training locality: {{ 'enforced' if enforce_training_locality else 'skipped' }}.
      Inference locality: {{ 'enforced' if enforce_inference_locality else 'skipped' }}.
      Cross-border audit: {{ 'enabled' if cross_border_audit_enabled else 'disabled' }}.
      Auto-remediation: {{ 'enabled' if auto_remediate_violations else 'disabled' }}.
      Sovereignty monitoring: {{ 'deployed' if deploy_sovereignty_monitoring else 'skipped' }}.
