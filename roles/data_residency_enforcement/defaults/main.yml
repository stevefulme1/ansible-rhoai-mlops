---
rhoai_api_url: "https://rhoai.example.com"
rhoai_api_token: ""
rhoai_validate_certs: true

# Geo-fencing policies
residency_policies: []
# Example:
#   - policy_name: "eu-data-residency"
#     allowed_regions: ["eu-west-1", "eu-central-1"]
#     denied_regions: []
#     data_classification: "confidential"
#     enforcement_mode: "enforce"
#     applies_to: "all"

# Default allowed regions (EU regions)
default_allowed_regions:
  - "eu-west-1"
  - "eu-central-1"
  - "eu-north-1"

# Default enforcement mode: audit (log only) or enforce (block)
default_enforcement_mode: "audit"

# Default jurisdiction for sovereignty reports
default_jurisdiction: "eu"

# Training data locality
enforce_training_locality: true
training_locality_policy_name: "training-data-locality"
training_allowed_regions:
  - "eu-west-1"
  - "eu-central-1"
training_denied_regions: []
training_data_classification: "confidential"

# Inference data locality
enforce_inference_locality: true
inference_locality_policy_name: "inference-data-locality"
inference_allowed_regions:
  - "eu-west-1"
  - "eu-central-1"
inference_denied_regions: []
inference_data_classification: "internal"

# Cross-border audit
cross_border_audit_enabled: true
cross_border_audit_name: "cross-border-data-flow-audit"
auto_remediate_violations: false

# Sovereignty monitoring
deploy_sovereignty_monitoring: true
sovereignty_report_name: "data-sovereignty-status"
