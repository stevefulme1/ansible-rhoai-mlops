---
- name: Validate drift response parameters
  ansible.builtin.assert:
    that:
      - inference_service | length > 0
      - namespace | length > 0
    fail_msg: "Parameters inference_service and namespace are required."

- name: Get current model version info
  stevefulme1.rhoai_mlops.inference_service_info:
    api_url: "{{ rhoai_api_url }}"
    api_token: "{{ rhoai_api_token }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    namespace: "{{ namespace }}"
    name: "{{ inference_service }}"
  register: current_service

- name: Get last stable model version
  stevefulme1.rhoai_mlops.model_version_info:
    api_url: "{{ rhoai_api_url }}"
    api_token: "{{ rhoai_api_token }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    model_id: "{{ model_name }}"
  register: model_versions
  when: rollback_enabled

- name: Set stable version fact
  ansible.builtin.set_fact:
    stable_version: >-
      {{ model_versions.model_versions
         | selectattr('labels.' ~ stable_version_tag, 'defined')
         | sort(attribute='createTimeSinceEpoch')
         | last }}
  when:
    - rollback_enabled
    - model_versions.model_versions | length > 0

- name: Rollback to last stable version
  stevefulme1.rhoai_mlops.inference_service:
    api_url: "{{ rhoai_api_url }}"
    api_token: "{{ rhoai_api_token }}"
    validate_certs: "{{ rhoai_validate_certs }}"
    name: "{{ inference_service }}"
    namespace: "{{ namespace }}"
    storage_uri: "{{ stable_version.artifact_uri }}"
    state: present
    wait: true
    wait_timeout: 300
  register: rollback_result
  when:
    - rollback_enabled
    - stable_version is defined

- name: Send notification webhook
  ansible.builtin.uri:
    url: "{{ notification_webhook }}"
    method: POST
    body_format: json
    body:
      event: model_drift_rollback
      model: "{{ model_name }}"
      service: "{{ inference_service }}"
      namespace: "{{ namespace }}"
      rolled_back: "{{ rollback_enabled }}"
      status: "{{ 'rolled_back' if rollback_result is changed else 'alert_only' }}"
    status_code: [200, 201, 202]
  when: notification_webhook | length > 0
  ignore_errors: true

- name: Send email notification
  community.general.mail:
    host: localhost
    to: "{{ notification_email }}"
    subject: "Model Drift Alert: {{ model_name }}"
    body: >-
      Model drift detected for {{ model_name }} in namespace {{ namespace }}.
      Inference service: {{ inference_service }}.
      Action taken: {{ 'Rolled back to stable version' if rollback_result is changed else 'Alert only' }}.
  when: notification_email | length > 0
  ignore_errors: true
