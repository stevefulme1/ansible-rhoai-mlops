---
# Integration tests for stevefulme1.rhoai_mlops.serving_runtime
# Full CRUD lifecycle: CREATE -> idempotency -> UPDATE -> DELETE -> idempotency

- name: Test serving_runtime CRUD lifecycle
  block:
    - name: Create serving_runtime (check mode)
      stevefulme1.rhoai_mlops.serving_runtime:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-serving-runtime"
        namespace: "{{ rhoai_namespace }}"
        runtime_type: "ovms"
        image: "quay.io/openvino/model_server:latest"
        supported_formats:
          - "onnx"
          - "openvino_ir"
        state: present
      check_mode: true
      register: check_result

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed

    - name: Create serving_runtime
      stevefulme1.rhoai_mlops.serving_runtime:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-serving-runtime"
        namespace: "{{ rhoai_namespace }}"
        runtime_type: "ovms"
        image: "quay.io/openvino/model_server:latest"
        supported_formats:
          - "onnx"
          - "openvino_ir"
        state: present
      register: create_result

    - name: Verify create result
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.serving_runtime is defined

    - name: Create serving_runtime again (idempotency)
      stevefulme1.rhoai_mlops.serving_runtime:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-serving-runtime"
        namespace: "{{ rhoai_namespace }}"
        runtime_type: "ovms"
        image: "quay.io/openvino/model_server:latest"
        supported_formats:
          - "onnx"
          - "openvino_ir"
        state: present
      register: idem_result

    - name: Verify idempotency
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Fetch serving_runtime info
      stevefulme1.rhoai_mlops.serving_runtime_info:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
      register: info_result

    - name: Verify info returns data
      ansible.builtin.assert:
        that:
          - info_result.serving_runtimes is defined

    - name: Update serving_runtime
      stevefulme1.rhoai_mlops.serving_runtime:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-serving-runtime"
        namespace: "{{ rhoai_namespace }}"
        runtime_type: "ovms"
        image: "quay.io/openvino/model_server:latest"
        supported_formats:
          - "onnx"
          - "openvino_ir"
          - "tensorflow"
        state: present
      register: update_result

    - name: Verify update result
      ansible.builtin.assert:
        that:
          - update_result is changed

    - name: Delete serving_runtime
      stevefulme1.rhoai_mlops.serving_runtime:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-serving-runtime"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_result

    - name: Verify delete result
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete serving_runtime again (idempotency)
      stevefulme1.rhoai_mlops.serving_runtime:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-serving-runtime"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_idem_result

    - name: Verify delete idempotency
      ansible.builtin.assert:
        that:
          - delete_idem_result is not changed

  always:
    - name: Cleanup - ensure test resource is removed
      stevefulme1.rhoai_mlops.serving_runtime:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-serving-runtime"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      failed_when: false
