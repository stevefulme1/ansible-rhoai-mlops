---
# Integration tests for stevefulme1.rhoai_mlops.inference_service
# Full CRUD lifecycle: CREATE -> idempotency -> UPDATE -> DELETE -> idempotency

- name: Test inference_service CRUD lifecycle
  block:
    - name: Create inference_service (check mode)
      stevefulme1.rhoai_mlops.inference_service:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-inference-svc"
        namespace: "{{ rhoai_namespace }}"
        model_format: "onnx"
        runtime: "ovms"
        storage_uri: "s3://test-bucket/model"
        min_replicas: 1
        max_replicas: 2
        state: present
      check_mode: true
      register: check_result

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed

    - name: Create inference_service
      stevefulme1.rhoai_mlops.inference_service:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-inference-svc"
        namespace: "{{ rhoai_namespace }}"
        model_format: "onnx"
        runtime: "ovms"
        storage_uri: "s3://test-bucket/model"
        min_replicas: 1
        max_replicas: 2
        state: present
      register: create_result

    - name: Verify create result
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.inference_service is defined

    - name: Create inference_service again (idempotency)
      stevefulme1.rhoai_mlops.inference_service:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-inference-svc"
        namespace: "{{ rhoai_namespace }}"
        model_format: "onnx"
        runtime: "ovms"
        storage_uri: "s3://test-bucket/model"
        min_replicas: 1
        max_replicas: 2
        state: present
      register: idem_result

    - name: Verify idempotency
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Fetch inference_service info
      stevefulme1.rhoai_mlops.inference_service_info:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
      register: info_result

    - name: Verify info returns data
      ansible.builtin.assert:
        that:
          - info_result.inference_services is defined

    - name: Update inference_service
      stevefulme1.rhoai_mlops.inference_service:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-inference-svc"
        namespace: "{{ rhoai_namespace }}"
        model_format: "onnx"
        runtime: "ovms"
        storage_uri: "s3://test-bucket/model"
        min_replicas: 1
        max_replicas: 3
        state: present
      register: update_result

    - name: Verify update result
      ansible.builtin.assert:
        that:
          - update_result is changed

    - name: Delete inference_service
      stevefulme1.rhoai_mlops.inference_service:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-inference-svc"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_result

    - name: Verify delete result
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete inference_service again (idempotency)
      stevefulme1.rhoai_mlops.inference_service:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-inference-svc"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_idem_result

    - name: Verify delete idempotency
      ansible.builtin.assert:
        that:
          - delete_idem_result is not changed

  always:
    - name: Cleanup - ensure test resource is removed
      stevefulme1.rhoai_mlops.inference_service:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-inference-svc"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      failed_when: false
