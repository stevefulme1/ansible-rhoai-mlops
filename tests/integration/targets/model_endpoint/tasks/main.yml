---
# Integration tests for stevefulme1.rhoai_mlops.model_endpoint
# Full CRUD lifecycle: CREATE -> idempotency -> UPDATE -> DELETE -> idempotency

- name: Test model_endpoint CRUD lifecycle
  block:
    - name: Create model_endpoint (check mode)
      stevefulme1.rhoai_mlops.model_endpoint:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-endpoint"
        namespace: "{{ rhoai_namespace }}"
        inference_service: "test-inference-svc"
        auth_enabled: false
        state: present
      check_mode: true
      register: check_result

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed

    - name: Create model_endpoint
      stevefulme1.rhoai_mlops.model_endpoint:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-endpoint"
        namespace: "{{ rhoai_namespace }}"
        inference_service: "test-inference-svc"
        auth_enabled: false
        state: present
      register: create_result

    - name: Verify create result
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.model_endpoint is defined

    - name: Create model_endpoint again (idempotency)
      stevefulme1.rhoai_mlops.model_endpoint:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-endpoint"
        namespace: "{{ rhoai_namespace }}"
        inference_service: "test-inference-svc"
        auth_enabled: false
        state: present
      register: idem_result

    - name: Verify idempotency
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Fetch model_endpoint info
      stevefulme1.rhoai_mlops.model_endpoint_info:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
      register: info_result

    - name: Verify info returns data
      ansible.builtin.assert:
        that:
          - info_result.model_endpoints is defined

    - name: Update model_endpoint
      stevefulme1.rhoai_mlops.model_endpoint:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-endpoint"
        namespace: "{{ rhoai_namespace }}"
        inference_service: "test-inference-svc"
        auth_enabled: true
        state: present
      register: update_result

    - name: Verify update result
      ansible.builtin.assert:
        that:
          - update_result is changed

    - name: Delete model_endpoint
      stevefulme1.rhoai_mlops.model_endpoint:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-endpoint"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_result

    - name: Verify delete result
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete model_endpoint again (idempotency)
      stevefulme1.rhoai_mlops.model_endpoint:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-endpoint"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_idem_result

    - name: Verify delete idempotency
      ansible.builtin.assert:
        that:
          - delete_idem_result is not changed

  always:
    - name: Cleanup - ensure test resource is removed
      stevefulme1.rhoai_mlops.model_endpoint:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-endpoint"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      failed_when: false
