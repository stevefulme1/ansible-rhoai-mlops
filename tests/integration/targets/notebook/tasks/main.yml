---
# Integration tests for stevefulme1.rhoai_mlops.notebook
# Full CRUD lifecycle: CREATE -> idempotency -> UPDATE -> DELETE -> idempotency

- name: Test notebook CRUD lifecycle
  block:
    - name: Create notebook (check mode)
      stevefulme1.rhoai_mlops.notebook:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-notebook"
        namespace: "{{ rhoai_namespace }}"
        image: "quay.io/rhoai/jupyter-minimal:latest"
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
        storage_size: "5Gi"
        state: present
      check_mode: true
      register: check_result

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed

    - name: Create notebook
      stevefulme1.rhoai_mlops.notebook:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-notebook"
        namespace: "{{ rhoai_namespace }}"
        image: "quay.io/rhoai/jupyter-minimal:latest"
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
        storage_size: "5Gi"
        state: present
      register: create_result

    - name: Verify create result
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.notebook is defined

    - name: Create notebook again (idempotency)
      stevefulme1.rhoai_mlops.notebook:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-notebook"
        namespace: "{{ rhoai_namespace }}"
        image: "quay.io/rhoai/jupyter-minimal:latest"
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
        storage_size: "5Gi"
        state: present
      register: idem_result

    - name: Verify idempotency
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Fetch notebook info
      stevefulme1.rhoai_mlops.notebook_info:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
      register: info_result

    - name: Verify info returns data
      ansible.builtin.assert:
        that:
          - info_result.notebooks is defined

    - name: Update notebook
      stevefulme1.rhoai_mlops.notebook:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-notebook"
        namespace: "{{ rhoai_namespace }}"
        image: "quay.io/rhoai/jupyter-minimal:latest"
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
        storage_size: "5Gi"
        state: present
      register: update_result

    - name: Verify update result
      ansible.builtin.assert:
        that:
          - update_result is changed

    - name: Delete notebook
      stevefulme1.rhoai_mlops.notebook:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-notebook"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_result

    - name: Verify delete result
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete notebook again (idempotency)
      stevefulme1.rhoai_mlops.notebook:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-notebook"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_idem_result

    - name: Verify delete idempotency
      ansible.builtin.assert:
        that:
          - delete_idem_result is not changed

  always:
    - name: Cleanup - ensure test resource is removed
      stevefulme1.rhoai_mlops.notebook:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-notebook"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      failed_when: false
