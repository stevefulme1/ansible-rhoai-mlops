---
# Integration tests for stevefulme1.rhoai_mlops.model_version
# Full CRUD lifecycle: CREATE -> idempotency -> UPDATE -> DELETE -> idempotency

- name: Test model_version CRUD lifecycle
  block:
    - name: Create model_version (check mode)
      stevefulme1.rhoai_mlops.model_version:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        model_id: "test-model-registry"
        version_name: "v1.0"
        description: "Initial version"
        artifact_uri: "s3://test-bucket/model/v1"
        labels:
          stage: "dev"
        state: present
      check_mode: true
      register: check_result

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed

    - name: Create model_version
      stevefulme1.rhoai_mlops.model_version:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        model_id: "test-model-registry"
        version_name: "v1.0"
        description: "Initial version"
        artifact_uri: "s3://test-bucket/model/v1"
        labels:
          stage: "dev"
        state: present
      register: create_result

    - name: Verify create result
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.model_version is defined

    - name: Create model_version again (idempotency)
      stevefulme1.rhoai_mlops.model_version:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        model_id: "test-model-registry"
        version_name: "v1.0"
        description: "Initial version"
        artifact_uri: "s3://test-bucket/model/v1"
        labels:
          stage: "dev"
        state: present
      register: idem_result

    - name: Verify idempotency
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Fetch model_version info
      stevefulme1.rhoai_mlops.model_version_info:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
      register: info_result

    - name: Verify info returns data
      ansible.builtin.assert:
        that:
          - info_result.model_versions is defined

    - name: Update model_version
      stevefulme1.rhoai_mlops.model_version:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        model_id: "test-model-registry"
        version_name: "v1.0"
        description: "Updated version"
        artifact_uri: "s3://test-bucket/model/v1"
        labels:
          stage: "staging"
        state: present
      register: update_result

    - name: Verify update result
      ansible.builtin.assert:
        that:
          - update_result is changed

    - name: Delete model_version
      stevefulme1.rhoai_mlops.model_version:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        model_id: "test-model-registry"
        version_name: "v1.0"
        state: absent
      register: delete_result

    - name: Verify delete result
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete model_version again (idempotency)
      stevefulme1.rhoai_mlops.model_version:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        model_id: "test-model-registry"
        version_name: "v1.0"
        state: absent
      register: delete_idem_result

    - name: Verify delete idempotency
      ansible.builtin.assert:
        that:
          - delete_idem_result is not changed

  always:
    - name: Cleanup - ensure test resource is removed
      stevefulme1.rhoai_mlops.model_version:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        model_id: "test-model-registry"
        version_name: "v1.0"
        state: absent
      failed_when: false
