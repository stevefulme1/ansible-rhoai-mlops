---
# Integration tests for stevefulme1.rhoai_mlops.pipeline
# Full CRUD lifecycle: CREATE -> idempotency -> UPDATE -> DELETE -> idempotency

- name: Test pipeline CRUD lifecycle
  block:
    - name: Create pipeline (check mode)
      stevefulme1.rhoai_mlops.pipeline:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-pipeline"
        namespace: "{{ rhoai_namespace }}"
        description: "Integration test pipeline"
        state: present
      check_mode: true
      register: check_result

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed

    - name: Create pipeline
      stevefulme1.rhoai_mlops.pipeline:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-pipeline"
        namespace: "{{ rhoai_namespace }}"
        description: "Integration test pipeline"
        state: present
      register: create_result

    - name: Verify create result
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.pipeline is defined

    - name: Create pipeline again (idempotency)
      stevefulme1.rhoai_mlops.pipeline:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-pipeline"
        namespace: "{{ rhoai_namespace }}"
        description: "Integration test pipeline"
        state: present
      register: idem_result

    - name: Verify idempotency
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Fetch pipeline info
      stevefulme1.rhoai_mlops.pipeline_info:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
      register: info_result

    - name: Verify info returns data
      ansible.builtin.assert:
        that:
          - info_result.pipelines is defined

    - name: Update pipeline
      stevefulme1.rhoai_mlops.pipeline:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-pipeline"
        namespace: "{{ rhoai_namespace }}"
        description: "Updated integration test pipeline"
        state: present
      register: update_result

    - name: Verify update result
      ansible.builtin.assert:
        that:
          - update_result is changed

    - name: Delete pipeline
      stevefulme1.rhoai_mlops.pipeline:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-pipeline"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_result

    - name: Verify delete result
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete pipeline again (idempotency)
      stevefulme1.rhoai_mlops.pipeline:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-pipeline"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      register: delete_idem_result

    - name: Verify delete idempotency
      ansible.builtin.assert:
        that:
          - delete_idem_result is not changed

  always:
    - name: Cleanup - ensure test resource is removed
      stevefulme1.rhoai_mlops.pipeline:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-pipeline"
        namespace: "{{ rhoai_namespace }}"
        state: absent
      failed_when: false
