---
# Integration tests for stevefulme1.rhoai_mlops.data_science_project
# Full CRUD lifecycle: CREATE -> idempotency -> UPDATE -> DELETE -> idempotency

- name: Test data_science_project CRUD lifecycle
  block:
    - name: Create data science project (check mode)
      stevefulme1.rhoai_mlops.data_science_project:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-ds-project"
        description: "Integration test project"
        labels:
          env: test
        state: present
      check_mode: true
      register: check_result

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed

    - name: Create data science project
      stevefulme1.rhoai_mlops.data_science_project:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-ds-project"
        description: "Integration test project"
        labels:
          env: test
        state: present
      register: create_result

    - name: Verify create result
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.data_science_project is defined
          - create_result.data_science_project.name == "test-ds-project"

    - name: Create data science project again (idempotency)
      stevefulme1.rhoai_mlops.data_science_project:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-ds-project"
        description: "Integration test project"
        labels:
          env: test
        state: present
      register: idem_result

    - name: Verify idempotency
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Fetch project info
      stevefulme1.rhoai_mlops.data_science_project_info:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
      register: info_result

    - name: Verify info returns data
      ansible.builtin.assert:
        that:
          - info_result.data_science_projects is defined

    - name: Update data science project
      stevefulme1.rhoai_mlops.data_science_project:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-ds-project"
        description: "Updated integration test project"
        labels:
          env: test
          updated: "true"
        state: present
      register: update_result

    - name: Verify update result
      ansible.builtin.assert:
        that:
          - update_result is changed

    - name: Delete data science project
      stevefulme1.rhoai_mlops.data_science_project:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-ds-project"
        state: absent
      register: delete_result

    - name: Verify delete result
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete data science project again (idempotency)
      stevefulme1.rhoai_mlops.data_science_project:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-ds-project"
        state: absent
      register: delete_idem_result

    - name: Verify delete idempotency
      ansible.builtin.assert:
        that:
          - delete_idem_result is not changed

  always:
    - name: Cleanup - ensure test project is removed
      stevefulme1.rhoai_mlops.data_science_project:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(false) }}"
        name: "test-ds-project"
        state: absent
      failed_when: false
