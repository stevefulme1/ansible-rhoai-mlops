---
- name: GPU Health Remediation
  hosts: all
  sources:
    - stevefulme1.rhoai_mlops.model_monitoring:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(true) }}"
        poll_interval: 10
        severity_filter: warning
  rules:
    - name: Migrate workloads on GPU errors
      condition: >-
        event.model_monitoring.event_type == "gpu_error"
        and event.model_monitoring.severity == "critical"
      action:
        run_playbook:
          name: stevefulme1.rhoai_mlops.model_drift_response
          extra_vars:
            model_name: "{{ event.model_monitoring.model_name }}"
            inference_service: "{{ event.model_monitoring.inference_service }}"
            namespace: "{{ event.model_monitoring.namespace }}"
            remediation_type: gpu_migration
            error_details: "{{ event.model_monitoring.message }}"

    - name: Alert on GPU memory pressure
      condition: >-
        event.model_monitoring.event_type == "gpu_memory_pressure"
        and event.model_monitoring.severity in ["warning", "critical"]
      action:
        run_playbook:
          name: stevefulme1.rhoai_mlops.model_drift_response
          extra_vars:
            model_name: "{{ event.model_monitoring.model_name }}"
            namespace: "{{ event.model_monitoring.namespace }}"
            remediation_type: gpu_memory_alert
            gpu_utilization: "{{ event.model_monitoring.metric_value }}"

    - name: Scale down on sustained GPU throttling
      condition: >-
        event.model_monitoring.event_type == "gpu_throttling"
      action:
        run_playbook:
          name: stevefulme1.rhoai_mlops.model_drift_response
          extra_vars:
            inference_service: "{{ event.model_monitoring.inference_service }}"
            namespace: "{{ event.model_monitoring.namespace }}"
            remediation_type: scale_adjustment
