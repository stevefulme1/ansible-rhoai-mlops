---
- name: Training Failure Recovery
  hosts: all
  sources:
    - stevefulme1.rhoai_mlops.pipeline_events:
        api_url: "{{ rhoai_api_url }}"
        api_token: "{{ rhoai_api_token }}"
        validate_certs: "{{ rhoai_validate_certs | default(true) }}"
        poll_interval: 15
  rules:
    - name: Retry failed training from checkpoint
      condition: >-
        event.pipeline_events.event_type == "pipeline_run_failed"
      action:
        run_playbook:
          name: stevefulme1.rhoai_mlops.training_job_recovery
          extra_vars:
            run_id: "{{ event.pipeline_events.run_id }}"
            run_name: "{{ event.pipeline_events.run_name }}"
            pipeline_id: "{{ event.pipeline_events.pipeline_id }}"
            pipeline_name: "{{ event.pipeline_events.pipeline_name }}"
            namespace: "{{ event.pipeline_events.namespace }}"
            error_message: "{{ event.pipeline_events.error_message }}"

    - name: Notify on persistent pipeline failure
      condition: >-
        event.pipeline_events.event_type == "pipeline_run_failed"
        and event.pipeline_events.error_message is search("ResourceExhausted|OutOfMemory")
      action:
        run_playbook:
          name: stevefulme1.rhoai_mlops.training_job_recovery
          extra_vars:
            run_id: "{{ event.pipeline_events.run_id }}"
            namespace: "{{ event.pipeline_events.namespace }}"
            error_message: "{{ event.pipeline_events.error_message }}"
            escalate: true
